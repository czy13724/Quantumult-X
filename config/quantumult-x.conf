[general]
# > 用于节点延迟测试
server_check_url = http://www.gstatic.com/generate_204
# > 服务器测试超时时间 (毫秒)
server_check_timeout = 3000
# > 用于设置右上角图标显示
profile_img_url = https://fastly.jsdelivr.net/gh/czy13724/LeviIcons@main/leviicons/Panda.png

#--------------------
# > 用于Check节点IP地址(以下geo_location_checker任选一个即可，注：只能启用一个)
# > [本仓库自用/维护 原始链接]
geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/czy13724/Quantumult-X/main/geo/ip-api.js
# > [本仓库自用/维护 CDN加速]
;geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://fastly.jsdelivr.net/gh/czy13724/Quantumult-X@main/geo/ip-api.js
# > [显示名称-详细地址-国旗 CDN加速]
;geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://fastly.jsdelivr.net/gh/I-am-R-E/Functional-Store-Hub@Master/GeoLocationChecker/QuantumultX/IP-API.js
# > [中文显示地区 CDN加速]
;geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://fastly.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/IP_API.js
# > [显示名称及无国旗 CDN加速]
;geo_location_checker = http://extreme-ip-lookup.com/json/, https://fastly.jsdelivr.net/gh/crossutility/Quantumult-X@master/sample-location-with-script.js
# > [显示英文名称及国旗 CDN加速]
;geo_location_checker = http://ifconfig.co/json, https://fastly.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/IPConfig.js
# > 禁用
;geo_location_checker = disabled

#--------------------
# > 解析器，用于引用资源的转换
# > [CDN 加速]
;resource_parser_url = https://fastly.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js
# > [原始链接]
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js

#--------------------
# > 下列路径将不经过QuantumultX的处理
excluded_routes = 239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32
udp_whitelist = 1-442, 444-65535
