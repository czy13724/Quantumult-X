[dns]
# > 建议开启 DoH 以防止 DNS 劫持，但也可能增加延迟，可视情况取消注释
;prefer-doh3
doh-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
# > 禁用 IPv6 (建议，避免部分应用 IPv6 连接慢)
no-ipv6
# > 忽略系统 DNS
no-system
